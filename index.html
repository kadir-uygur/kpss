<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPSS & Kamu İlan Takip Portalı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans">

  <!-- Header -->
  <header class="bg-indigo-700 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold flex items-center gap-2">
          <i class="fa-solid fa-briefcase"></i> Kamu İlan Takip Paneli
        </h1>
        <p class="text-indigo-200 text-sm mt-1">
          Beden Eğitimi ve Spor | KPSS P3 (65+) | Malatya & Merkezi İlanlar
        </p>
      </div>
      <div id="last-updated" class="text-xs bg-indigo-800/80 px-3 py-1.5 rounded-full border border-indigo-500/30">
        Son Güncelleme: Yükleniyor...
      </div>
    </div>
  </header>

  <!-- Filtre ve Arama -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
      
      <!-- Arama Kutusu -->
      <div class="relative w-full md:w-80">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
        <input type="text" id="searchInput" placeholder="İlan başlığında ara..." 
               class="w-full pl-9 pr-4 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <!-- Kategori Filtre Butonları -->
      <div class="flex flex-wrap gap-2 w-full md:w-auto">
        <button onclick="filterCategory('all')" class="filter-btn active px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white">Tümü</button>
        <button onclick="filterCategory('spor')" class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200">Spor & BESYO</button>
        <button onclick="filterCategory('malatya')" class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200">Malatya Yerel</button>
        <button onclick="filterCategory('genel')" class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200">Genel Lisans (4001)</button>
      </div>
    </div>

    <!-- İlan Kartları Listesi -->
    <div id="ilan-listesi" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <div class="col-span-full text-center py-12 text-slate-400">
        <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i>
        <p>İlanlar yükleniyor, lütfen bekleyin...</p>
      </div>
    </div>
  </main>

  <script>
    let allAds = [];
    let activeFilter = 'all';

    async function loadAds() {
      try {
        const res = await fetch('ilanlar.json?t=' + new Date().getTime());
        const data = await res.json();
        
        document.getElementById('last-updated').innerText = `Son Güncelleme: ${data.last_updated || 'Bilinmiyor'}`;
        allAds = data.ilanlar || [];
        renderAds();
      } catch (err) {
        document.getElementById('ilan-listesi').innerHTML = `
          <div class="col-span-full bg-white p-8 rounded-xl border border-dashed border-slate-300 text-center">
            <i class="fa-solid fa-triangle-exclamation text-amber-500 text-3xl mb-2"></i>
            <p class="text-slate-600">Henüz taranmış ilan verisi bulunamadı veya ilk tarama çalışıyor.</p>
          </div>`;
      }
    }

    function renderAds() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('ilan-listesi');

      const filtered = allAds.filter(ad => {
        const matchesCat = (activeFilter === 'all') || (ad.category === activeFilter);
        const matchesSearch = ad.title.toLowerCase().includes(search) || ad.source.toLowerCase().includes(search);
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-12 bg-white rounded-xl border border-slate-200">
            <p class="text-slate-500 text-sm">Arama kriterlerine uygun ilan bulunamadı.</p>
          </div>`;
        return;
      }

      container.innerHTML = filtered.map(ad => {
        const badgeColor = ad.category === 'spor' ? 'bg-emerald-100 text-emerald-800 border-emerald-300' :
                           ad.category === 'malatya' ? 'bg-amber-100 text-amber-800 border-amber-300' :
                           'bg-blue-100 text-blue-800 border-blue-300';
        
        const catLabel = ad.category === 'spor' ? 'Spor / BESYO' :
                         ad.category === 'malatya' ? 'Malatya' : 'Genel Lisans';

        return `
          <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition">
            <div>
              <div class="flex items-center justify-between gap-2 mb-3">
                <span class="text-xs font-semibold px-2.5 py-1 rounded-full border ${badgeColor}">
                  ${catLabel}
                </span>
                <span class="text-xs text-slate-400 font-medium">${ad.source}</span>
              </div>
              <h3 class="font-semibold text-slate-800 text-base line-clamp-3 mb-4" title="${ad.title}">
                ${ad.title}
              </h3>
            </div>
            <div class="pt-3 border-t border-slate-100 flex items-center justify-between mt-auto">
              <span class="text-xs text-slate-400">${ad.date || 'Aktif İlan'}</span>
              <a href="${ad.link}" target="_blank" rel="noopener noreferrer" 
                 class="inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-600 hover:text-indigo-800">
                Detayları Gör <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCategory(cat) {
      activeFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-indigo-600', 'text-white');
        btn.classList.add('bg-slate-100', 'text-slate-700');
      });
      event.target.classList.remove('bg-slate-100', 'text-slate-700');
      event.target.classList.add('bg-indigo-600', 'text-white');
      renderAds();
    }

    document.getElementById('searchInput').addEventListener('input', renderAds);
    window.addEventListener('DOMContentLoaded', loadAds);
  </script>
</body>
</html>
